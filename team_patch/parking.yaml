parking:
  ros__parameters:
    # 1) 주차 표지판이 가까이 보이면 시작
    min_confidence: 0.5             # YOLO 신뢰도가 이보다 낮으면 무시
    sign_area_ratio_threshold: 0.02 # 표지판 크기 / 화면 크기. 이보다 커야(= 가까워야) 시작
                                    #   입구 근처에서 GUI 표지판 area 가 0.036 정도였음. 너무 일찍 시작하면 키우기
    sign_hits_needed: 2             # 연속으로 이만큼 봐야 시작
    skip_sign: false                # 시험용. true 면 표지판 없이 켜자마자 시작

    # 2) 색 / 화면 (BEV 400x400, 1px = 1mm)
    image_topic: image_bev
    yellow_l_min: 80                # 노란색 (lane_detection.yaml 과 같게)
    yellow_b_min: 150
    yellow_a_max: 135
    white_l_min: 190                # 흰색 (lane_detection.yaml 과 같게)
    white_ab_dev: 15
    bev_center_x: 0.5               # 로봇 가로 위치 (화면 폭 비율)
    lane_width_px: 295.0            # 차선 폭 [px]
    line_min_rows: 40               # 선을 이을 때 필요한 최소 줄 수
    flat_min_pixels: 35             # 한 줄에 점이 이만큼 이상이면 가로로 누운 부분 -> 선 이을 때 뺌

    # 3) 흰선 따라 직진 (입구 전까지. 왼쪽 노란선이 휘어도 안 따라감)
    use_lane_speed: true            # true = 주차 시작할 때 lane_follower 의 linear_speed (GUI 선속도) 와 같은 속도로 감
    drive_speed: 0.10               # [m/s] lane_follower 속도를 못 받거나 use_lane_speed 가 false 일 때
    heading_gain: 1.0
    offset_gain: 1.0
    offset_soft_px: 300.0
    max_angular: 0.6                # [rad/s]
    robot_y_offset_px: 179.0        # 화면 맨 아래가 바퀴 축에서 몇 px(mm) 앞인지. bird_eye_view.yaml 과 같게!
                                    #   2026-10-13 카메라 각도 수정 후 보정 = 179 (17.9cm), 그 전 보정 = 141

    # 4) 입구 찾기: 왼쪽 아래 칸의 노란선이 있음 -> 없음(입구) -> 다시 있음(반대쪽 모서리)이면 회전
    watch_x_max: 120                # 칸 가로 범위 [0, 이 값) px
    watch_rows: 20                  # 칸 세로 줄 수
    watch_bottom: 390               # 칸의 맨 아래 줄 (최대 399). 도는 위치는 이 값과 robot_y_offset_px 로 자동 계산
    present_pixels: 80              # 이 이상이면 "노란선 있음"
    empty_pixels: 15                # 이 이하면 "노란선 없음"
    gap_frames_needed: 2            # 연속 이만큼 프레임
    extra_forward_m: -0.04          # [m] 돌기 전 더 갈 거리 (늦게 돌면 -, 일찍 돌면 +). 자동 계산한 거리에 더해짐
                                    #   실제 시험에서 지나쳐서 돌아서 -0.02 -> -0.04
                                    #   자동 거리(카메라 17.9cm 기준 약 4cm)보다 더 빼도 0 보다 일찍은 안 돎.
                                    #   그보다 더 일찍 돌려면 watch_bottom 을 줄이기 (10 줄 = 1cm 일찍)

    # 5) 회전: 입구 길의 두 노란선이 화면에 세로로 똑바로 보일 때까지 왼쪽으로
    turn_speed: 0.4                 # [rad/s] 돌기 시작할 때 (가장 빠른) 속도
    turn_min_speed: 0.08            # [rad/s] 노란선이 거의 세로일 때 (가장 느린) 속도. 너무 낮으면 모터가 안 돎
    turn_slow_angle_deg: 60.0       # 길 노란선이 이 각도보다 덜 기울면 느려지기 시작 (세로에 가까울수록 turn_min_speed 쪽)
    turn_slow_power: 2.0            # 1 = 고르게 느려짐, 2 = 세로에 가까울수록 훨씬 많이 느려짐 (클수록 더 일찍 많이 느려짐)
    aligned_deg: 4.0                # 두 선이 모두 이 각도 안이면 멈춤 (1.5 -> 4: 잘 못 찾아서 널널하게)
    parallel_deg: 15.0              # 두 선 기울기 차이가 이보다 크면 아직 길이 아님 (8 -> 15)
    pair_gap_min_px: 150.0          # 두 선 간격이 이 범위여야 길로 봄 (200~380 -> 150~420)
    pair_gap_max_px: 420.0
    single_line_ok: true            # 한 선만 보여도 길 옆선 자리에 aligned_deg 안으로 서 있으면 멈춤
    single_line_margin_px: 80.0     # 길 옆선 자리 = 로봇 가운데 ± 차선 폭/2, 이만큼 [px] 벗어나도 됨
    turn_min_time: 1.0              # [s] 돌기 시작하고 이 시간 전에는 안 멈춤
    turn_fit_rows: 230              # 화면 위쪽 이 줄까지만 봄 (아래쪽은 입구의 둥근 모서리)

    # 6) 주차장 길 올라가기: 양쪽 노란선 가운데로. 노란선이 끝나면 흰 점선(통로 / 칸 경계)을 이어서 따라감
    #    차선(노란선 / 흰 점선)이 다 끝나면 멈춤
    stem_use_white: true            # false 면 노란선만 보고, 노란선이 끝나는 곳(주차장 입구)에서 멈춤
    same_line_px: 40.0              # 왼쪽 칸 / 오른쪽 칸에서 찾은 두 선이 이만큼 가까우면 한 선 (화면 가운데에 걸친 선)
    stem_end_frames: 3              # 노란선이 둘 다 연속 이만큼 안 보이면 길 끝
    stem_min_time: 2.0              # [s] 올라가기 시작하고 이 시간 전에는 길 끝으로 안 봄
    stem_timeout: 20.0              # [s]

    # 7) 주차장 길 / 통로를 올라가는 중 옆 PSD 가 가까우면 (장애물) 그쪽을 기억하고 계속 가다가,
    #    앞의 가로 흰 선이 화면에서 사라지기 직전에 그쪽으로 90도 돌고 멈춤 (장애물을 못 봤으면 그냥 멈춤)
    #    도는 각도는 화면의 직선들이 돈 각도로 잰다 (카메라). 못 재면 odom, odom 도 없으면 시간
    #    (도로를 달릴 때는 PSD 를 안 봄)
    side_psd_threshold: 0.15        # [m] 왼쪽이 이 이하 -> 왼쪽으로, 오른쪽이 이 이하 -> 오른쪽으로
    side_hits_needed: 3             # 연속 이만큼 (PSD 20Hz -> 0.15초). 잡음 거르기
    side_turn_deg: 90.0             # 돌 각도 (90 = 가로 흰 선이 세로가 될 때까지)
    side_turn_toward: true          # true = PSD 가 가까운 쪽으로 돎, false = 반대쪽으로
    side_turn_when: white           # 언제 돌지
                                    #   white = PSD 로 본 쪽을 기억했다가, 앞의 가로 흰 선(주차장 끝)이 화면 아래에 오면
                                    #   seen  = PSD 로 보자마자
                                    #   clear = 장애물을 다 지나가서 그쪽 PSD 가 side_clear_threshold 보다 멀어지면
    white_trigger_y: 350            # (390 -> 350: 회전 중 흰 선을 놓치지 않게 조금 일찍) 가로 흰 선이 BEV 의 이 줄(0 위 ~ 399 맨 아래)보다 아래로 오면 돎. 일찍 돌려면 줄이기
    white_arm_y: 300                # 이 줄보다 아래 있던 흰 선이 다음 영상에서 안 보여도 돎 (= 막 화면 밖으로 나감)
    white_row_min_pixels: 150       # 한 줄에 흰 점이 이만큼 이상이어야 가로 흰 선
    white_center_ratio: 0.6         # 화면 가운데 40% 구간을 이만큼 채워야 함 (입구 쪽 테두리는 가운데가 뚫려 있어 빠짐)
    side_turn_by_camera: true       # 화면의 직선(흰선/노란선)들이 돈 각도로 회전 각도를 잼 (false = odom)
    side_cam_min_line_px: 60        # 이보다 짧은 직선 조각은 안 씀 [px]
    side_cam_max_step_deg: 20.0     # 영상 한 장 사이에 이보다 많이 돌지는 않는다고 봄
    side_cam_lost_frames: 5         # 직선을 연속 이만큼 못 찾으면 odom 으로 이어서 잼
    side_cam_max_extra_deg: 15.0    # 카메라로 도는 중 odom 각도가 목표 + 이 값을 넘으면 무조건 멈춤 (안전)
    side_clear_threshold: 0.20      # [m] 장애물 본 쪽 PSD 가 이보다 멀어지면 "다 지나감" (0.15 보다 조금 크게)
    side_turn_speed: 0.3            # [rad/s] 최대 회전 속도 (실제 시험 후 0.6 -> 0.3)
    side_min_speed: 0.08            # [rad/s] 목표 각도 바로 앞 (가장 느린) 속도. 너무 낮으면 모터가 안 돎
    side_slow_angle_deg: 30.0       # 남은 각도가 이보다 작아지면 느려지기 시작
    side_slow_power: 2.0            # 1 = 고르게 느려짐, 2 = 목표에 가까울수록 훨씬 많이 느려짐
    side_tolerance_deg: 1.0         # 남은 각도가 이 이하면 멈춤
    odom_timeout: 0.5               # [s] odom 이 이보다 오래 안 오면 odom 없는 걸로 봄

    # 8) 90도 돈 뒤 후진 (뒤에는 센서가 없으니 천천히)
    backup_time: 3.0                # [s] 0 이면 후진 안 함
    backup_speed: 0.06              # [m/s] 3초면 약 18cm

    # 9) 후진 뒤: 두 바퀴 다 앞으로, 속도 차를 줘서 곡선으로 90도 (90도 돌았던 쪽과 같은 쪽)
    #    -> 들어왔던 길을 반대로 내려가서 노란선을 지나 도로로 나오면 멈춤 (STOP "parking_node:exited")
    exit_enable: true               # false 면 후진 뒤 그냥 멈춤 (예전처럼)
    exit_arc_speed: 0.08            # [m/s] 곡선 도는 앞 속도
    exit_arc_radius_m: 0.0          # [m] 곡선 반지름을 직접 정함. 0 = 후진한 거리 x exit_arc_radius_gain
    exit_arc_radius_gain: 2.0       # 곡선 반지름 = 후진한 거리 (backup_speed x backup_time) x 이 값 (3초면 18cm x 2 = 36cm)
                                    #   이 로봇은 회전 명령보다 약 2배 더 돌아서 실제로는 그 절반쯤으로 돈다
                                    #   아직 확 꺾이면 키우고 (2.5), 너무 크게 돌아 반대쪽 노란선 쪽으로 가면 줄이기 (1.5)
    exit_arc_min_radius_m: 0.12     # [m] 이보다 작게는 안 함 (바퀴 간격 절반 9.5cm 보다 작으면 안쪽 바퀴가 뒤로 돎)
    exit_arc_deg: 90.0              # 노란선이 안 보일 때 돌 각도
    exit_check_ratio: 0.3           # 이만큼 (30%) 돈 뒤부터 노란선이 세로인지 본다
    exit_line_max_rms_px: 8.0       # 노란선 점들이 직선에서 평균 이보다 많이 벗어나면 안 씀 (두 선이 섞인 것)
    exit_overshoot_deg: 15.0        # 노란선이 이보다 많이 지나친 걸로 보이면 잘못 찾은 선으로 봄
    exit_wait_yellow_deg: 15.0      # 노란선이 안 보이면 화면 직선 각도로 exit_arc_deg + 이 값까지 돌며 노란선을 기다림
    exit_stop_y: 350                # 도로 흰선이 BEV 의 이 줄보다 아래로 오면 멈춤. 크게 하면 더 나가서 멈춤
    exit_white_max_tilt_deg: 30.0   # 로봇이 비스듬해서 도로 흰선이 이만큼까지 기울어 보여도 찾음
    exit_timeout: 20.0              # [s] 길을 내려가는 데 이보다 오래 걸리면 멈춤

    # 안전
    front_stop_distance: 0.10       # [m]
    image_timeout: 0.5              # [s]
    approach_timeout: 30.0          # [s]
    turn_timeout: 15.0              # [s] 천천히 돌게 바꿔서 8 -> 15 (시뮬레이션에서 약 8.5초 걸림)
